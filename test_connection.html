<!DOCTYPE html>
<html>
<head>
    <title>Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <button onclick="testFlask()">Test Flask (8001)</button>
    <button onclick="testFastAPI()">Test FastAPI (8000)</button>
    <button onclick="testBoth()">Test Both</button>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function log(message, isSuccess = true) {
            const div = document.createElement('div');
            div.className = 'test ' + (isSuccess ? 'success' : 'error');
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        async function testFlask() {
            log('Testing Flask (8001)...');
            try {
                const response = await fetch('http://localhost:8001/jobs');
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Flask SUCCESS: ${data.length} jobs found`);
                } else {
                    log(`❌ Flask ERROR: ${response.status}`, false);
                }
            } catch (error) {
                log(`❌ Flask FAILED: ${error.message}`, false);
            }
        }
        
        async function testFastAPI() {
            log('Testing FastAPI (8000)...');
            try {
                const response = await fetch('http://localhost:8000/jobs');
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ FastAPI SUCCESS: ${data.length} jobs found`);
                } else {
                    log(`❌ FastAPI ERROR: ${response.status}`, false);
                }
            } catch (error) {
                log(`❌ FastAPI FAILED: ${error.message}`, false);
            }
        }
        
        async function testBoth() {
            results.innerHTML = '';
            await testFlask();
            await testFastAPI();
        }
        
        // Auto test on load
        window.onload = testBoth;
    </script>
</body>
</html>
